<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Web client not built yet</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #F7F3EA; color: #1C2321;
    }
    @media (prefers-color-scheme: dark) { body { background: #161A18; color: #ECE6D8; } }
    main { text-align: center; padding: 2rem; }
    h1 { font-weight: 600; margin: 0 0 .5rem; }
    p { margin: .25rem 0; opacity: .8; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1 id="name">Loading</h1>
    <p>web client not built yet</p>
    <p>The API is up. Try <code><a href="/api/system/version">/api/system/version</a></code>.</p>
  </main>
  <script>
    // The placeholder reads the product name from the server so nothing here hard-codes it.
    fetch('/api/system/version').then(function (r) { return r.json(); }).then(function (v) {
      document.getElementById('name').textContent = v.brand.productName;
      document.title = v.brand.productName + ': web client not built yet';
    }).catch(function () { document.getElementById('name').textContent = 'API'; });
  </script>
</body>
</html>

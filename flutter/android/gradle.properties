org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# R8 full mode (the AGP default) does not keep a class's no-argument constructor for a plain
# library keep rule, which breaks libraries that create classes by reflection (WorkManager's Room
# database, ML Kit's registrars) and crashed the release build at launch. Compatibility mode keeps them.
android.enableR8.fullMode=false
